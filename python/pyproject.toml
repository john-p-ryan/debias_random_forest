[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debiasforest"
version = "0.1.0"
description = "Bias correction for random forest regression (Chen, Withana Gamage & Ryan 2022)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["scikit-learn>=1.4", "numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]
demo = ["matplotlib", "pandas", "jupyter", "nbconvert", "ipykernel", "joblib", "tabulate"]

[tool.hatch.build.targets.wheel]
packages = ["src/debiasforest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*never out-of-bag.*:RuntimeWarning"]
